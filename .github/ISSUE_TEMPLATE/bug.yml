name: Bug report
description: Report a problem in Sunny
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the Sunny version, macOS version and chip (Apple silicon or Intel).
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the behavior you observed and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Attach a synthetic or publicly redistributable PDF if it helps reproduce the issue.
    validations:
      required: true
